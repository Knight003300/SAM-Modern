<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Steam 成就管理器 · SAM</title>
<link rel="stylesheet" href="app.css" />
</head>
<body data-mode="picker">

<div class="app" id="app">

  <header class="titlebar" id="titlebar">
    <div class="titlebar__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.2 3.8h9.6v4.4a4.8 4.8 0 0 1-9.6 0V3.8Z" />
          <path d="M7.2 4.8H4.9a2.6 2.6 0 0 0 2.3 4.4" />
          <path d="M16.8 4.8h2.3a2.6 2.6 0 0 1-2.3 4.4" />
          <path d="M12 13v2.9" />
          <path d="M8.7 20.2h6.6l-.85-2.7H9.55l-.85 2.7Z" />
        </svg>
      </span>
      <span class="brand__text">
        <span class="brand__title">Steam 成就管理器 · SAM</span>
        <span class="brand__sub" id="brandSub">成就与统计编辑工具</span>
      </span>
    </div>

    <div class="titlebar__meta">
      <span class="chip chip--mock" id="mockChip" hidden>
        <span class="chip__dot"></span>演示数据
      </span>
      <span class="chip" id="userChip" hidden></span>
    </div>

    <div class="winbtns">
      <button type="button" class="winbtn" id="btnMin" title="最小化" aria-label="最小化">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2.2 5h5.6" /></svg>
      </button>
      <button type="button" class="winbtn" id="btnMax" title="最大化" aria-label="最大化">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><rect x="2.4" y="2.4" width="5.2" height="5.2" rx="1.1" /></svg>
      </button>
      <button type="button" class="winbtn winbtn--close" id="btnClose" title="关闭" aria-label="关闭">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.7 2.7 7.3 7.3M7.3 2.7 2.7 7.3" /></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar__row" id="tbPicker">
      <label class="search" for="pickerSearch">
        <svg class="search__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="7" cy="7" r="4.4" /><path d="M10.4 10.4 14 14" />
        </svg>
        <input class="search__input" id="pickerSearch" type="text" placeholder="搜索游戏名称…" autocomplete="off" spellcheck="false" />
        <button type="button" class="search__clear" id="pickerSearchClear" title="清空" aria-label="清空" hidden>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.4 3.4 8.6 8.6M8.6 3.4 3.4 8.6" /></svg>
        </button>
      </label>

      <div class="seg" id="pickerTypeSeg" role="group" aria-label="游戏类型">
        <button type="button" class="seg__item is-active" data-type="all" aria-pressed="true">全部</button>
        <button type="button" class="seg__item" data-type="normal" aria-pressed="false">正式版</button>
        <button type="button" class="seg__item" data-type="demo" aria-pressed="false">试玩</button>
        <button type="button" class="seg__item" data-type="mod" aria-pressed="false">模组</button>
        <button type="button" class="seg__item" data-type="junk" aria-pressed="false">其他</button>
      </div>

      <div class="toolbar__spacer"></div>

      <button type="button" class="btn btn--ghost" id="btnReload">
        <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16.2 8.6A6.4 6.4 0 1 0 16 12" /><path d="M16.6 4.6v4.2h-4.2" />
        </svg>
        <span>重新扫描</span>
      </button>
    </div>

    <div class="toolbar__row" id="tbGame" hidden>
      <button type="button" class="btn btn--ghost" id="btnBack" title="返回游戏库（Esc 也可返回）">
        <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11.6 4.4 6 10l5.6 5.6" />
        </svg>
        <span>游戏库</span>
      </button>

      <button type="button" class="btn btn--accent" id="btnRandom" title="按随机间隔逐个解锁成就，模拟真实游戏节奏">
        <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.6h3.2l5.6 8.8H16" /><path d="M13.4 12.2 16 14.4l-2.6 2.2" /><path d="M4 14.4h3.2l1.9-3" /><path d="M12.1 8.2 13.4 6.4H16" />
        </svg>
        <span class="btn__label" id="randomLabel">随机时间解锁</span>
      </button>

      <div class="toolbar__spacer"></div>

      <button type="button" class="btn btn--primary" id="btnSave" disabled>
        <span class="spinner spinner--sm" id="saveSpinner" hidden></span>
        <span class="btn__label" id="saveLabel">保存改动</span>
        <span class="badge" id="saveBadge" hidden>0</span>
      </button>
    </div>
  </div>

  <main class="stage">

    <section class="view view--picker" id="viewPicker" aria-label="游戏选择">
      <div class="game-grid" id="gameGrid"></div>

      <div class="skel-grid" id="pickerSkeleton" aria-hidden="true"></div>

      <div class="empty" id="pickerEmpty" hidden>
        <p class="empty__title" id="pickerEmptyTitle">还没有可管理的游戏</p>
        <p class="empty__text" id="pickerEmptyText">未在 Steam 库中找到任何游戏，试试重新扫描。</p>
      </div>
    </section>

    <section class="view view--game" id="viewGame" aria-label="成就管理" hidden>
      <aside class="side" id="gameSide">
        <div class="side__scroll">
          <div class="side__cover" id="sideCover"></div>
          <h1 class="side__title" id="sideTitle">—</h1>
          <div class="side__meta" id="sideMeta"></div>

          <div class="progress">
            <div class="progress__num"><span id="progUnlocked">0</span><span class="progress__slash">/</span><span id="progTotal">0</span></div>
            <div class="progress__track" aria-hidden="true"><span class="progress__fill" id="progFill"></span></div>
            <div class="progress__meta"><span id="progPct">0%</span><span class="progress__rest" id="progRest">剩余 0 项</span></div>
          </div>

          <dl class="side__facts" id="sideFacts"></dl>
        </div>

        <div class="side__actions">
          <button type="button" class="btn btn--ghost btn--block" id="btnRefresh">
            <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M16.2 8.6A6.4 6.4 0 1 0 16 12" /><path d="M16.6 4.6v4.2h-4.2" />
            </svg>
            <span>刷新数据</span>
          </button>
          <button type="button" class="btn btn--danger btn--block" id="btnReset">
            <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.4 6.2h11.2M8.2 6.2V4.5h3.6v1.7M6 6.2l.7 9.3h6.6l.7-9.3" />
            </svg>
            <span>重置统计</span>
          </button>
        </div>
      </aside>

      <div class="panel">
        <div class="content-head">
          <div class="seg seg--tabs" id="gameTabs" role="tablist" aria-label="内容切换">
            <button type="button" class="seg__item is-active" data-tab="achievements" role="tab" aria-selected="true">成就</button>
            <button type="button" class="seg__item" data-tab="stats" role="tab" aria-selected="false">统计</button>
          </div>

          <label class="search search--inline" id="achSearchWrap" for="achSearch">
            <svg class="search__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.4" /><path d="M10.4 10.4 14 14" />
            </svg>
            <input class="search__input" id="achSearch" type="text" placeholder="搜索成就…" autocomplete="off" spellcheck="false" />
            <button type="button" class="search__clear" id="achSearchClear" title="清空" aria-label="清空" hidden>
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3.4 3.4 8.6 8.6M8.6 3.4 3.4 8.6" /></svg>
            </button>
          </label>

          <div class="seg" id="achFilterSeg" role="group" aria-label="成就筛选">
            <button type="button" class="seg__item is-active" data-filter="all" aria-pressed="true">全部</button>
            <button type="button" class="seg__item" data-filter="unlocked" aria-pressed="false">已解锁</button>
            <button type="button" class="seg__item" data-filter="locked" aria-pressed="false">未解锁</button>
            <button type="button" class="seg__item" data-filter="rare" aria-pressed="false">稀有</button>
          </div>

          <div class="content-head__spacer"></div>

          <div class="actions" id="achActions">
            <button type="button" class="btn btn--ghost btn--icon" data-act="unlockAll" title="全部解锁" aria-label="全部解锁">
              <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3.6 10.6 7 14l4.4-5" /><path d="M9.4 10.6 12.8 14l4.4-5" />
              </svg>
            </button>
            <button type="button" class="btn btn--ghost btn--icon" data-act="invertAll" title="反转解锁状态" aria-label="反转解锁状态">
              <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6.4h8.6l-2-2" /><path d="M16 13.6H7.4l2 2" />
              </svg>
            </button>
            <button type="button" class="btn btn--ghost btn--icon" data-act="lockAll" title="全部锁定" aria-label="全部锁定">
              <svg class="btn__ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5.2" y="9" width="9.6" height="7" rx="1.6" /><path d="M7.4 9V7.2a2.6 2.6 0 0 1 5.2 0V9" />
              </svg>
            </button>
          </div>
        </div>

        <div class="panel__body" id="panelBody">

          <div class="unlock-bar" id="unlockBar" hidden>
            <span class="unlock-bar__dot" aria-hidden="true"></span>
            <span class="unlock-bar__text" id="unlockBarText">随机解锁进行中…</span>
            <span class="unlock-bar__track" aria-hidden="true">
              <span class="unlock-bar__fill" id="unlockBarFill"></span>
            </span>
            <button type="button" class="btn btn--ghost btn--sm" id="btnUnlockStop">停止</button>
          </div>

          <div class="ach-list" id="achGrid"></div>

          <div class="empty empty--tight" id="achEmpty" hidden>
            <p class="empty__title" id="achEmptyTitle">没有匹配的成就</p>
            <p class="empty__text" id="achEmptyText">换个关键词或切换筛选条件试试。</p>
          </div>

          <div class="stat-wrap" id="statWrap" hidden>
            <table class="stat-table">
              <thead>
                <tr>
                  <th class="c-name">统计项目</th>
                  <th class="c-val">当前值</th>
                  <th class="c-range">取值范围</th>
                  <th class="c-flag">属性</th>
                </tr>
              </thead>
              <tbody id="statBody"></tbody>
            </table>
            <p class="stat-hint">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                <circle cx="8" cy="8" r="6" /><path d="M8 7.2v3.6M8 5.1v.1" />
              </svg>
              <span>直接修改数值即可，受保护的统计项不可编辑；改动会在点击「保存改动」后写入。</span>
            </p>
          </div>

          <div class="empty" id="gameLoading" hidden>
            <span class="spinner spinner--lg"></span>
            <p class="empty__title">正在读取游戏数据…</p>
            <p class="empty__text">请稍候，正在从 Steam 拉取成就与统计。</p>
          </div>

        </div>
      </div>
    </section>

  </main>

  <footer class="statusbar">
    <div class="statusbar__left">
      <span class="spinner spinner--sm" id="statusSpinner" hidden></span>
      <span class="statusbar__text" id="statusText">正在初始化…</span>
    </div>
    <div class="statusbar__right" id="statusMeta"></div>
  </footer>

</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div class="modal-root" id="modalRoot" hidden></div>

<script src="app.js"></script>
</body>
</html>
